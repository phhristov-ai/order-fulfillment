
syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.inventory.grpc";
option java_outer_classname = "InventoryProto";

service InventoryService {

  rpc GetProduct (ProductRequest)
      returns (ProductResponse);

  rpc CheckStock (StockCheckRequest)
      returns (StockCheckResponse);

  rpc ReserveStock (ReserveStockRequest)
      returns (ReserveStockResponse);

  rpc WatchStock(ProductRequest)
      returns (stream StockUpdate);

  rpc ReserveMultipleStocks(stream ReserveStockRequest)
      returns (ReserveMultipleStocksResponse);

  rpc ProcessOrderStream(stream OrderItemRequest)
      returns (stream OrderItemResponse);

}

message ProductRequest {
  int64 product_id = 1;
}

message ProductResponse {
  int64 product_id = 1;
  string name = 2;
  double price = 3;
  int32 available_quantity = 4;
}

message StockCheckRequest {
  int64 product_id = 1;
  int32 requested_quantity = 2;
}

message StockCheckResponse {
  bool available = 1;
  int32 available_quantity = 2;
}

message ReserveStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  int64 product_id = 1;
  string name = 2;
  double price = 3;
  int32 remaining_quantity = 4;
}

message StockUpdate {
  int64 product_id = 1;
  int32 available_quantity = 2;
}

message ReserveMultipleStocksResponse {
  int32 successful_reservations = 1;
  int32 failed_reservations = 2;
  repeated ReservationResult results = 3;
}

message ReservationResult {
  int64 product_id = 1;
  int32 requested_quantity = 2;
  int32 remaining_quantity = 3;
  bool successful = 4;
  string error_message = 5;
}

message OrderItemRequest {
  int64 order_id = 1;
  int64 product_id = 2;
  int32 quantity = 3;
}

message OrderItemResponse {
  int64 order_id = 1;
  int64 product_id = 2;
  bool successful = 3;
  int32 remaining_quantity = 4;
  string message = 5;
}