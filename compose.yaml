
services:

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "9090:9090"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    depends_on:
      - inventory-service
    environment:
      # Configure your gRPC client to connect to:
      # inventory-service:9090
      SPRING_PROFILES_ACTIVE: docker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order-frontend
    ports:
      - "3000:80"
    depends_on:
      - order-service
